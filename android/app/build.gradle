plugins { id 'com.android.application' }
def buildNum = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
android {
    namespace 'com.izbrannyi.game'
    compileSdk 34
    defaultConfig {
        applicationId 'com.izbrannyi.game'
        minSdk 24
        targetSdk 34
        versionCode buildNum
        versionName '4.0'
    }
    buildTypes { debug { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
