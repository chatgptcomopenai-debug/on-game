<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1c2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Избранный</title>
<style>html,body{margin:0;height:100%;background:#1a1c2c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif;color:#fff}
#game{position:fixed;inset:0;width:100vw;height:100dvh;display:block;image-rendering:pixelated}
.hidden{display:none!important}
#joy-zone{position:fixed;left:0;top:0;width:50vw;height:100dvh}
#joy-base{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);display:none}
#joy-knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.45)}
#buttons{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:18px;display:grid;grid-template-columns:auto auto;gap:12px;align-items:end}
.btn{width:68px;height:68px;border-radius:50%;border:3px solid #fff8;background:#0006;color:#fff;font:bold 26px system-ui;touch-action:none;padding:0}
.btn.big{width:84px;height:84px;grid-column:2;grid-row:2}
.btn.small{width:58px;height:58px;font-size:24px;grid-column:2;grid-row:1;justify-self:center}
#btn-a{grid-column:1;grid-row:2}
.btn.on{background:#fff4}
.btn.cd{opacity:.45}
.exit{position:fixed;right:calc(10px + env(safe-area-inset-right));top:8px;width:34px;height:34px;border-radius:8px;border:2px solid #fff6;background:#0006;color:#fff;font-size:16px}
@media (pointer:fine){#joy-zone,#buttons{display:none}}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,22,40,.72);padding:12px;box-sizing:border-box;touch-action:auto}
.panel{background:#2b2f4f;border:3px solid #ffd23f;border-radius:14px;padding:14px 20px;min-width:260px;max-width:92vw;max-height:94dvh;overflow:auto;text-align:center;box-shadow:0 6px 0 #0008}
h1{margin:4px 0 10px;font-size:26px;color:#ffd23f;letter-spacing:2px;text-shadow:3px 3px 0 #000}
h2{margin:4px 0 8px;font-size:20px}
input,select{font:600 17px system-ui;padding:9px 12px;border-radius:9px;border:2px solid #fff4;background:#1a1c2c;color:#fff;margin:4px;box-sizing:border-box}
#in-nick,#in-pass{width:230px;display:block;margin:6px auto}
#in-code{width:110px;text-transform:uppercase;letter-spacing:3px;text-align:center}
.big-btn{font:bold 17px system-ui;padding:10px 18px;border-radius:10px;border:none;background:#ffd23f;color:#1a1c2c;margin:5px;box-shadow:0 4px 0 #a8861c}
.big-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8861c}
.mid-btn{font:600 15px system-ui;padding:8px 14px;border-radius:9px;border:2px solid #fff6;background:#0004;color:#fff;margin:5px}
.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap}
.err{color:#ff6b6b;min-height:1em;margin:6px 0 0;font-weight:600}
.hint{color:#c9cbe0;margin:4px 0 8px;font-size:14px}
.code{color:#ffd23f;letter-spacing:4px;font-size:26px}
ul,ol{list-style:none;padding:0;margin:6px 0;text-align:left;min-width:220px}
li{padding:5px 8px;margin:3px 0;border-radius:7px;background:#0003;font-weight:600;display:flex;justify-content:space-between;gap:12px}
li .dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
body:not(.is-host) .host-only{display:none}
body.is-host .client-only{display:none}
#rotate{display:none;position:fixed;inset:0;background:#1a1c2c;color:#fff;font:600 20px system-ui;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:9}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="controls" class="hidden">
  <div id="joy-zone"><div id="joy-base"><div id="joy-knob"></div></div></div>
  <div id="buttons">
    <button id="btn-b" class="btn small">⇢</button>
    <button id="btn-a" class="btn">✊</button>
    <button id="btn-jump" class="btn big">⤒</button>
  </div>
  <button id="btn-exit" class="exit">✕</button>
</div>

<div id="scr-login" class="screen">
  <div class="panel">
    <h1>👑 ИЗБРАННЫЙ</h1>
    <input id="in-nick" maxlength="12" placeholder="Твой ник" autocomplete="off">
    <input id="in-pass" type="password" inputmode="numeric" placeholder="Пароль" autocomplete="off">
    <button id="go-login" class="big-btn">Войти</button>
    <p id="login-err" class="err"></p>
  </div>
</div>

<div id="scr-menu" class="screen hidden">
  <div class="panel">
    <h1>👑 ИЗБРАННЫЙ</h1>
    <p class="hint">Привет, <b id="menu-nick"></b>!</p>
    <div class="row"><button id="go-bots" class="big-btn">🤖 Играть с ботами</button>
      <select id="bots-n"><option value="2">2 бота</option><option value="3" selected>3 бота</option><option value="4">4 бота</option><option value="5">5 ботов</option></select></div>
    <button id="go-host" class="big-btn">🌐 Создать комнату</button>
    <div class="row"><input id="in-code" maxlength="5" placeholder="КОД" autocomplete="off"><button id="go-join" class="big-btn">Войти</button></div>
    <p id="menu-err" class="err"></p>
  </div>
</div>

<div id="scr-lobby" class="screen hidden">
  <div class="panel">
    <h2>Комната <span id="lobby-code" class="code"></span></h2>
    <p class="hint" id="lobby-hint">Скажи код друзьям (и пароль)</p>
    <ul id="lobby-list"></ul>
    <div class="row host-only"><button id="bot-add" class="mid-btn">+ бот</button><button id="bot-del" class="mid-btn">− бот</button></div>
    <button id="go-start" class="big-btn host-only">▶ Начать</button>
    <button id="lobby-leave" class="mid-btn">Выйти</button>
  </div>
</div>

<div id="scr-results" class="screen hidden">
  <div class="panel">
    <h2>🏆 Итоги матча</h2>
    <ol id="res-list"></ol>
    <p id="res-awards" class="hint"></p>
    <button id="go-rematch" class="big-btn host-only">🔁 Реванш</button>
    <p class="hint client-only">Ждём, пока хост начнёт реванш…</p>
    <button id="res-menu" class="mid-btn">В меню</button>
  </div>
</div>

<div id="rotate">Поверни телефон горизонтально ↻</div>

<script>
"use strict";

// ===== config.js =====
// Все игровые числа — здесь (design/implementation-plan.md §6, адаптировано под вид сбоку)
const PASSWORD = '12345687';

const CFG = {
  W: 480, H: 270,            // внутреннее пиксельное разрешение, камера неподвижна
  TICK: 30, SNAP_EVERY: 2,   // тик симуляции 30 Гц, снапшоты 15 Гц
  gravity: 1100, accel: 1000, friction: 1100,
  jumpVel: 340, coyote: 0.1, jumpBuffer: 0.12,
  dashSpeed: 260, dashTime: 0.15, dashCd: 1.2, dashInv: 0.2,
  fallY: 300, hunterRespawn: 3, spawnInv: 1,
  hunter: { scale: 1.4, hp: 100, speed: 95, shotSpeed: 230, shotDmg: 8, shotCd: 0.35, shotRange: 200, aimRange: 230 },
  chosen: { hpPer: 190, speed: 88, regen: 0.01, regenDelay: 4, swapInv: 1.5, scale: 2 },
  powers: {
    fire:  { name: 'Пламя',  color: '#ff7a1a', hpMul: 1,   speedMul: 1,
             aDmg: 30, aSpeed: 150, aCd: 0.6, bR: 55, bDmg: 40, bTele: 0.4, bCd: 7 },
    bolt:  { name: 'Молния', color: '#ffe83a', hpMul: 0.8, speedMul: 1.25,
             aDmg: 18, aRange: 95, aJump: 75, aJumps: 2, aCd: 0.8, bDist: 105, bR: 38, bDmg: 25, bCd: 5 },
    ice:   { name: 'Лёд',    color: '#8ee8ff', hpMul: 1,   speedMul: 1,
             aDmg: 15, aSpeed: 200, aCd: 0.5, slow: 0.4, slowT: 1.5, wallT: 4, wallH: 44, bCd: 8 },
    giant: { name: 'Гигант', color: '#ff4dff', hpMul: 1.5, speedMul: 0.82, scale: 2.8,
             aDmg: 35, aTele: 0.3, aW: 46, aH: 34, aKb: 190, aCd: 1, bR: 62, bDmg: 45, bCd: 6, bJump: 380 },
  },
  bigLobbyCdMul: 0.85,       // при 5+ игроках КД способности B Избранного −15 %
  score: { kill: 100, per10dmg: 5, perSec: 2, maxPerLife: 60, hunterKill: 20, survive: 50 },
  comeback: 1.15,
  rounds: 5, roundTime: 90, countdown: 3, roundEndTime: 3.5,
  colors: ['#ff4d4d', '#4da6ff', '#5ce65c', '#ffd23f', '#c86bff', '#ff8c3a'],
  maxPlayers: 6,
  // остров (≈2,5× больше): solid = земля, остальные — проходимые снизу платформы
  platforms: [
    { x: 30, y: 190, w: 420, h: 10, solid: true },
    { x: 66, y: 152, w: 72, h: 4 },
    { x: 342, y: 152, w: 72, h: 4 },
    { x: 204, y: 122, w: 72, h: 4 },
    { x: 104, y: 92, w: 62, h: 4 },
    { x: 314, y: 92, w: 62, h: 4 },
    { x: 209, y: 62, w: 62, h: 4 },
  ],
  spawns: [[60, 190], [420, 190], [150, 190], [330, 190], [102, 152], [378, 152], [240, 122], [240, 190]],
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
  ],
};

// ===== sim/world.js =====
// Симуляция: без DOM. Физика, бой, силы, раунды, очки (план §1, §6)

const POWERS = Object.keys(CFG.powers);
const GROUND = CFG.platforms[0];
const rnd = a => a[Math.floor(Math.random() * a.length)];
const byId = (w, id) => w.players.find(p => p.id === id);
const isChosen = (w, p) => p && w.match.chosenId === p.id;
const hitH = p => 17 * p.scale;
const hitW = p => 8 * p.scale;

function createWorld() {
  return { time: 0, players: [], projs: [], teles: [], walls: [], fx: [],
    match: { phase: 'lobby', round: 0, timer: 0, chosenId: null, msg: '', msgT: 0 } };
}

function addPlayer(w, { id, name, color, label, isBot }) {
  const p = { id, name, color, label, isBot: !!isBot, x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, facing: 1,
    onGround: false, hp: CFG.hunter.hp, maxHp: CFG.hunter.hp, dead: 0, inv: 0, cdA: 0, cdB: 0, dashT: 0,
    slowT: 0, attackT: 0, coyT: 0, bufT: 0, dropT: 0, animT: 0, score: 0, dmgAcc: 0, lifeScore: 0,
    noDmgT: 0, slam: false, power: null, scale: CFG.hunter.scale, dmgLog: {}, stats: { dmg: 0, chosenTime: 0, kills: 0 } };
  w.players.push(p); placeAtSpawn(w, p); return p;
}

function removePlayer(w, id) {
  const p = byId(w, id); if (!p) return;
  w.players = w.players.filter(q => q !== p);
  if (w.match.chosenId === id && w.match.phase !== 'lobby' && w.players.length) {
    makeChosen(w, topRecentDamager(w, p) || rnd(w.players));
  }
}

function announce(w, msg) { w.match.msg = msg; w.match.msgT = 3; }

function placeAtSpawn(w, p) {
  const ch = byId(w, w.match.chosenId);
  const sp = CFG.spawns.map(s => [s, ch && ch !== p ? Math.abs(s[0] - ch.x) + Math.abs(s[1] - ch.y) : Math.random()])
    .sort((a, b) => b[1] - a[1]);
  const s = sp[Math.floor(Math.random() * Math.min(2, sp.length))][0];
  p.x = p.px = s[0]; p.y = p.py = s[1]; p.vx = p.vy = 0; p.onGround = true;
}

function makeHunter(p) { p.power = null; p.scale = CFG.hunter.scale; p.maxHp = CFG.hunter.hp; p.slam = false; p.dmgLog = {}; }

function makeChosen(w, p) {
  const key = rnd(POWERS), pw = CFG.powers[key];
  for (const q of w.players) if (q !== p && q.power) makeHunter(q);
  p.power = key; p.scale = pw.scale || CFG.chosen.scale;
  p.maxHp = Math.round(CFG.chosen.hpPer * Math.max(1, w.players.length - 1) * pw.hpMul);
  p.hp = p.maxHp; p.inv = CFG.chosen.swapInv; p.cdA = p.cdB = 0; p.lifeScore = 0; p.dmgLog = {}; p.slam = false;
  if (p.dead > 0) { p.dead = 0; placeAtSpawn(w, p); }
  w.match.chosenId = p.id;
  w.fx.push({ k: 'ring', x: p.x, y: p.y - 12, r: 40, c: pw.color, t: 0.5, ttl: 0.5 });
  announce(w, `${p.name} — Избранный! Сила: ${pw.name}`);
}

function startMatch(w) {
  for (const p of w.players) { p.score = 0; p.dmgAcc = 0; p.stats = { dmg: 0, chosenTime: 0, kills: 0 }; }
  w.match.round = 0; nextRound(w);
}

function nextRound(w) {
  const m = w.match; m.round++;
  w.projs = []; w.teles = []; w.walls = [];
  m.chosenId = null;
  for (const p of w.players) { makeHunter(p); p.hp = p.maxHp; p.dead = 0; p.inv = 0; p.cdA = p.cdB = 0; p.slowT = 0; }
  let ch;
  if (m.round === 1) ch = rnd(w.players);
  else { const min = Math.min(...w.players.map(p => p.score)); ch = rnd(w.players.filter(p => p.score === min)); }
  for (const p of w.players) placeAtSpawn(w, p);
  makeChosen(w, ch);
  m.phase = 'countdown'; m.timer = CFG.countdown;
}

function topRecentDamager(w, t) {
  let best = null, bv = 0;
  for (const id in t.dmgLog) {
    const e = t.dmgLog[id], q = byId(w, id);
    if (q && q !== t && e.t > w.time - 5 && e.amt > bv) { best = q; bv = e.amt; }
  }
  return best;
}

function isLastHunter(w, p) {
  const hs = w.players.filter(q => !isChosen(w, q));
  if (hs.length < 2) return false;
  const min = Math.min(...hs.map(q => q.score));
  return p.score === min && hs.filter(q => q.score === min).length === 1;
}

function damage(w, t, amt, src, o = {}) {
  if (!t || t.dead > 0 || t.inv > 0) return false;
  const chosenT = isChosen(w, t);
  let a = amt;
  if (src && !isChosen(w, src) && isLastHunter(w, src)) a *= CFG.comeback;
  t.hp -= a; t.noDmgT = 0;
  if (src) {
    src.stats.dmg += a;
    if (chosenT) {
      const e = t.dmgLog[src.id];
      t.dmgLog[src.id] = { amt: (e && e.t > w.time - 5 ? e.amt : 0) + a, t: w.time };
      src.dmgAcc += a;
      while (src.dmgAcc >= 10) { src.dmgAcc -= 10; src.score += CFG.score.per10dmg; }
    }
  }
  if (o.kb) { t.vx = o.kb * (o.dir || 1); t.vy = -150; t.onGround = false; }
  if (o.slow) t.slowT = o.slow;
  w.fx.push({ k: 'hit', x: t.x, y: t.y - hitH(t) / 2, c: o.c || '#fff', t: 0.25, ttl: 0.25 });
  if (t.hp <= 0) kill(w, t, src);
  return true;
}

function kill(w, t, src) {
  t.hp = 0; t.dead = CFG.hunterRespawn; t.vx = t.vy = 0; t.slam = false;
  w.fx.push({ k: 'ring', x: t.x, y: Math.min(t.y, 260) - 8, r: 22, c: t.color, t: 0.4, ttl: 0.4 });
  if (isChosen(w, t)) {
    let killer = src && src !== t ? src : null;
    if (killer) { killer.score += CFG.score.kill; killer.stats.kills++; }
    else killer = topRecentDamager(w, t);
    makeHunter(t);
    const others = w.players.filter(q => q !== t);
    if (!others.length) { t.dead = 0; placeAtSpawn(w, t); makeChosen(w, t); return; }
    makeChosen(w, killer || rnd(others));
  } else if (src && isChosen(w, src)) {
    src.score += CFG.score.hunterKill; src.stats.kills++;
  }
}

function respawn(w, p) {
  placeAtSpawn(w, p); p.hp = p.maxHp; p.inv = CFG.spawnInv; p.dead = 0;
}

// --- атаки ---
function aimAt(p, t, range) {
  if (t && t.dead <= 0 && (t.x - p.x) * p.facing > 0) {
    const dx = t.x - p.x, dy = (t.y - hitH(t) / 2) - (p.y - hitH(p) / 2), d = Math.hypot(dx, dy);
    if (d < range) return [dx / d, dy / d];
  }
  return [p.facing, 0];
}
function nearestHunter(w, p, range, from = p, exclude = []) {
  let best = null, bd = range;
  for (const q of w.players) {
    if (q === p || isChosen(w, q) || q.dead > 0 || exclude.includes(q)) continue;
    const d = Math.hypot(q.x - from.x, (q.y - 8) - (from.y - 8));
    if (d < bd) { bd = d; best = q; }
  }
  return best;
}
function frontHunter(w, p, range) {
  let best = null, bd = range;
  for (const q of w.players) {
    if (q === p || isChosen(w, q) || q.dead > 0 || (q.x - p.x) * p.facing <= 0) continue;
    const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd) { bd = d; best = q; }
  }
  return best;
}
function shoot(w, p, dir, spd, dmg, r, kind, c, range, extra = {}) {
  w.projs.push({ x: p.x + p.facing * 5 * p.scale, y: p.y - hitH(p) * 0.6, vx: dir[0] * spd, vy: dir[1] * spd,
    r, dmg, owner: p.id, team: isChosen(w, p) ? 'c' : 'h', ttl: range / spd, kind, c, ...extra });
}
function areaHit(w, owner, cx, cy, r, dmg, c, kb = 0) {
  for (const q of w.players) {
    if (q === owner || isChosen(w, q) || q.dead > 0) continue;
    if (Math.hypot(q.x - cx, (q.y - 8) - cy) <= r + 5) damage(w, q, dmg, owner, { c, kb, dir: Math.sign(q.x - cx) || 1 });
  }
}

function attackA(w, p) {
  p.attackT = 0.25;
  if (!isChosen(w, p)) {
    const H = CFG.hunter;
    p.cdA = H.shotCd;
    shoot(w, p, aimAt(p, byId(w, w.match.chosenId), H.aimRange), H.shotSpeed, H.shotDmg, 2, 'shot', p.color, H.shotRange);
    return;
  }
  const pw = CFG.powers[p.power]; p.cdA = pw.aCd;
  if (p.power === 'fire') shoot(w, p, aimAt(p, frontHunter(w, p, 200), 200), pw.aSpeed, pw.aDmg, 4, 'fire', pw.color, 260);
  else if (p.power === 'ice') shoot(w, p, aimAt(p, frontHunter(w, p, 220), 220), pw.aSpeed, pw.aDmg, 3, 'ice', pw.color, 240, { slow: pw.slowT });
  else if (p.power === 'bolt') {
    let from = { x: p.x, y: p.y - 6 }, hit = [], t = nearestHunter(w, p, pw.aRange);
    if (!t) { w.fx.push({ k: 'bolt', x1: p.x, y1: p.y - 14, x2: p.x + p.facing * 40, y2: p.y - 14, c: pw.color, t: 0.15, ttl: 0.15 }); return; }
    for (let i = 0; i <= pw.aJumps && t; i++) {
      w.fx.push({ k: 'bolt', x1: from.x, y1: from.y - 8, x2: t.x, y2: t.y - 8, c: pw.color, t: 0.2, ttl: 0.2 });
      damage(w, t, pw.aDmg, p, { c: pw.color }); hit.push(t); from = t;
      t = nearestHunter(w, p, pw.aJump, from, hit);
    }
  } else if (p.power === 'giant') {
    w.teles.push({ k: 'cone', owner: p.id, t: pw.aTele, ttl: pw.aTele, dmg: pw.aDmg, c: pw.color });
  }
}

function attackB(w, p) {
  const pw = CFG.powers[p.power];
  const cd = pw.bCd * (w.players.length >= 5 ? CFG.bigLobbyCdMul : 1);
  if (p.power === 'giant') { if (!p.onGround) return; p.vy = -pw.bJump; p.onGround = false; p.slam = true; }
  else if (p.power === 'fire') w.teles.push({ k: 'ring', owner: p.id, r: pw.bR, t: pw.bTele, ttl: pw.bTele, dmg: pw.bDmg, c: pw.color });
  else if (p.power === 'bolt') {
    const ox = p.x;
    p.x = Math.max(GROUND.x + 4, Math.min(GROUND.x + GROUND.w - 4, p.x + p.facing * pw.bDist)); p.px = p.x;
    w.fx.push({ k: 'bolt', x1: ox, y1: p.y - 12, x2: p.x, y2: p.y - 12, c: pw.color, t: 0.25, ttl: 0.25 });
    w.fx.push({ k: 'ring', x: p.x, y: p.y - 10, r: pw.bR, c: pw.color, t: 0.3, ttl: 0.3 });
    areaHit(w, p, p.x, p.y - 10, pw.bR, pw.bDmg, pw.color);
  } else if (p.power === 'ice') {
    w.walls.push({ x: p.x + p.facing * 24 - 3, y: p.y - pw.wallH, w: 6, h: pw.wallH, t: pw.wallT });
  }
  p.cdB = cd; p.attackT = 0.25;
}

function coneRect(p) {
  const pw = CFG.powers.giant;
  return { x: p.facing > 0 ? p.x + 4 : p.x - 4 - pw.aW, y: p.y - pw.aH, w: pw.aW, h: pw.aH };
}
function teleShape(w, t) {
  const o = byId(w, t.owner); if (!o) return null;
  if (t.k === 'cone') return { rect: coneRect(o) };
  return { cx: o.x, cy: o.y - 10, r: t.r };
}

const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);

// --- главный шаг ---
function step(w, inputs, dt) {
  const m = w.match;
  w.time += dt;
  m.msgT = Math.max(0, m.msgT - dt);
  if (m.phase === 'end') return;
  if (m.phase === 'countdown') { m.timer -= dt; if (m.timer <= 0) { m.phase = 'play'; m.timer = CFG.roundTime; } }
  else if (m.phase === 'play') {
    m.timer -= dt;
    if (m.timer <= 0) {
      const ch = byId(w, m.chosenId);
      if (ch && ch.dead <= 0) ch.score += CFG.score.survive;
      m.phase = 'roundEnd'; m.timer = CFG.roundEndTime;
      announce(w, ch ? `Раунд окончен! ${ch.name} выстоял(а) +${CFG.score.survive}` : 'Раунд окончен!');
    }
  } else if (m.phase === 'roundEnd') {
    m.timer -= dt;
    if (m.timer <= 0) { if (m.round >= CFG.rounds) { m.phase = 'end'; return; } nextRound(w); }
  }
  const canAct = m.phase === 'play' || m.phase === 'lobby';

  for (const p of w.players) {
    p.px = p.x; p.py = p.y;
    p.inv = Math.max(0, p.inv - dt); p.cdA = Math.max(0, p.cdA - dt); p.cdB = Math.max(0, p.cdB - dt);
    p.slowT = Math.max(0, p.slowT - dt); p.attackT = Math.max(0, p.attackT - dt); p.noDmgT += dt;
    if (p.dead > 0) { p.dead -= dt; if (p.dead <= 0) respawn(w, p); continue; }
    const inp = inputs[p.id] || {};
    const ch = isChosen(w, p), pw = ch ? CFG.powers[p.power] : null;
    let speed = ch ? CFG.chosen.speed * pw.speedMul : CFG.hunter.speed;
    if (p.slowT > 0) speed *= 1 - CFG.powers.ice.slow;
    const mx = Math.max(-1, Math.min(1, inp.mx || 0));
    if (mx) p.facing = Math.sign(mx);

    if (canAct && m.phase !== 'lobby') {
      if (inp.a && p.cdA <= 0) attackA(w, p);
      if (inp.b && p.cdB <= 0) {
        if (ch) attackB(w, p);
        else { p.dashT = CFG.dashTime; p.cdB = CFG.dashCd; p.inv = Math.max(p.inv, CFG.dashInv); }
      }
    } else if (inp.b && p.cdB <= 0 && !ch) { p.dashT = CFG.dashTime; p.cdB = CFG.dashCd; }
    if (inp.a && m.phase === 'lobby') p.attackT = 0.25;

    if (p.dashT > 0) { p.dashT -= dt; p.vx = p.facing * CFG.dashSpeed; p.vy = 0; }
    else {
      p.vx = approach(p.vx, mx * speed, (mx ? CFG.accel : CFG.friction) * dt);
      p.vy += CFG.gravity * dt;
    }
    p.coyT = p.onGround ? CFG.coyote : Math.max(0, p.coyT - dt);
    p.bufT = inp.jump ? CFG.jumpBuffer : Math.max(0, p.bufT - dt);
    if ((inp.my || 0) > 0.6 && inp.jump) { p.dropT = 0.25; p.bufT = 0; }
    if (p.bufT > 0 && p.coyT > 0) { p.vy = -CFG.jumpVel * (ch ? 0.95 : 1); p.bufT = 0; p.coyT = 0; p.onGround = false; }
    if (!inp.jumpHeld && !p.slam && p.vy < -120 && p.vy > -CFG.jumpVel - 1) p.vy = -120;
    p.dropT = Math.max(0, p.dropT - dt);

    const oldY = p.y;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.x = Math.max(4, Math.min(CFG.W - 4, p.x));
    const wasGround = p.onGround; p.onGround = false;
    if (p.vy >= 0) {
      for (const pl of CFG.platforms) {
        if (!pl.solid && p.dropT > 0) continue;
        if (p.x > pl.x - 3 && p.x < pl.x + pl.w + 3 && oldY <= pl.y + 0.01 && p.y >= pl.y) {
          p.y = pl.y; p.vy = 0; p.onGround = true; break;
        }
      }
    }
    if (p.onGround && p.slam) {
      p.slam = false;
      const g = CFG.powers.giant;
      w.fx.push({ k: 'ring', x: p.x, y: p.y - 6, r: g.bR, c: g.color, t: 0.35, ttl: 0.35 });
      areaHit(w, p, p.x, p.y - 6, g.bR, g.bDmg, g.color, 120);
    }
    p.animT += dt;
    if (ch && m.phase === 'play') {
      if (p.noDmgT > CFG.chosen.regenDelay) p.hp = Math.min(p.maxHp, p.hp + p.maxHp * CFG.chosen.regen * dt);
      p.stats.chosenTime += dt;
      const add = Math.min(CFG.score.perSec * dt, CFG.score.maxPerLife - p.lifeScore);
      if (add > 0) { p.lifeScore += add; p.score += add; }
    }
    if (p.y > CFG.fallY) kill(w, p, null);
  }

  // снаряды
  for (const pr of w.projs) {
    pr.x += pr.vx * dt; pr.y += pr.vy * dt; pr.ttl -= dt;
    if (pr.y > GROUND.y && pr.x > GROUND.x && pr.x < GROUND.x + GROUND.w) pr.ttl = 0;
    if (pr.team === 'h') for (const wl of w.walls)
      if (pr.x > wl.x - pr.r && pr.x < wl.x + wl.w + pr.r && pr.y > wl.y && pr.y < wl.y + wl.h) { pr.ttl = 0; w.fx.push({ k: 'hit', x: pr.x, y: pr.y, c: '#8ee8ff', t: 0.2, ttl: 0.2 }); }
    if (pr.ttl <= 0) continue;
    const src = byId(w, pr.owner);
    for (const q of w.players) {
      if (q.dead > 0 || q.id === pr.owner) continue;
      const qc = isChosen(w, q);
      if ((pr.team === 'h') !== qc) continue;
      const hw = hitW(q) / 2 + pr.r * (pr.team === 'h' ? 1.2 : 1), h = hitH(q);
      if (pr.x > q.x - hw && pr.x < q.x + hw && pr.y > q.y - h - pr.r && pr.y < q.y + pr.r) {
        damage(w, q, pr.dmg, src, { c: pr.c, slow: pr.slow });
        if (pr.kind === 'fire') w.fx.push({ k: 'ring', x: pr.x, y: pr.y, r: 12, c: pr.c, t: 0.25, ttl: 0.25 });
        pr.ttl = 0; break;
      }
    }
  }
  w.projs = w.projs.filter(p => p.ttl > 0);

  // телеграфы атак
  for (const t of w.teles) {
    t.t -= dt;
    if (t.t > 0) continue;
    const o = byId(w, t.owner); if (!o || o.dead > 0 || !isChosen(w, o)) continue;
    if (t.k === 'ring') {
      w.fx.push({ k: 'ring', x: o.x, y: o.y - 10, r: t.r, c: t.c, t: 0.35, ttl: 0.35 });
      areaHit(w, o, o.x, o.y - 10, t.r, t.dmg, t.c);
    } else if (t.k === 'cone') {
      const r = coneRect(o);
      w.fx.push({ k: 'rect', ...r, c: t.c, t: 0.2, ttl: 0.2 });
      for (const q of w.players) {
        if (q === o || isChosen(w, q) || q.dead > 0) continue;
        if (q.x + 4 > r.x && q.x - 4 < r.x + r.w && q.y > r.y && q.y - hitH(q) < r.y + r.h)
          damage(w, q, t.dmg, o, { c: t.c, kb: CFG.powers.giant.aKb, dir: o.facing });
      }
    }
  }
  w.teles = w.teles.filter(t => t.t > 0);
  for (const wl of w.walls) wl.t -= dt;
  w.walls = w.walls.filter(x => x.t > 0);
  for (const f of w.fx) f.t -= dt;
  w.fx = w.fx.filter(f => f.t > 0);
}

// ===== sim/bots.js =====
// ИИ ботов: охотники держат дистанцию и стреляют, Избранный преследует и бьёт силой


const G = CFG.platforms[0];
const mem = new Map();

function botInput(w, p) {
  const st = mem.get(p.id) || { wander: 0, react: 0, dir: 1 };
  mem.set(p.id, st);
  const inp = { mx: 0, my: 0, jump: false, jumpHeld: true, a: false, b: false };
  if (p.dead > 0) return inp;
  const ch = isChosen(w, p);
  let target = null;
  if (ch) {
    let bd = 1e9;
    for (const q of w.players) if (q !== p && q.dead <= 0) {
      const d = Math.abs(q.x - p.x) + Math.abs(q.y - p.y) * 1.5; if (d < bd) { bd = d; target = q; }
    }
  } else target = byId(w, w.match.chosenId);
  if (!target || target.dead > 0) {
    st.wander -= 1 / CFG.TICK;
    if (st.wander <= 0) { st.wander = 1 + Math.random() * 2; st.dir = Math.random() < 0.5 ? -1 : 1; }
    inp.mx = st.dir * 0.5;
  } else {
    const dx = target.x - p.x, dy = target.y - p.y, adx = Math.abs(dx);
    let want;
    if (ch) want = target.x;
    else want = target.x - Math.sign(dx || 1) * (70 + (p.id.length % 3) * 15); // держим дистанцию
    const d = want - p.x;
    inp.mx = Math.abs(d) > 8 ? Math.sign(d) : (Math.abs(dx) > 2 ? Math.sign(dx) * 0.12 : 0);
    if (!ch && Math.abs(d) <= 30) inp.mx = Math.sign(dx) * 0.12; // повернуться лицом к цели
    if (!ch && dx * p.facing > 0 && adx < 210 && Math.abs(dy) < 70) inp.a = true;
    // платформы
    if (dy < -20 && p.onGround && Math.random() < 0.08) inp.jump = true;
    if (dy > 20 && p.onGround && p.y < G.y && Math.random() < 0.05) { inp.my = 1; inp.jump = true; }
    if (Math.random() < 0.01 && p.onGround) inp.jump = true;
    const facingT = dx * p.facing > 0;
    st.react -= 1 / CFG.TICK;
    if (st.react <= 0) {
      st.react = 0.15 + Math.random() * 0.25;
      if (!ch) {
        const danger = w.teles.some(t => t.owner === target.id) && adx < 80;
        if ((danger || (adx < 35 && Math.random() < 0.3)) && p.cdB <= 0) inp.b = true;
      } else {
        const pw = p.power, range = pw === 'bolt' ? 90 : pw === 'giant' ? 48 : 190;
        if (adx < range && Math.abs(dy) < 50 && (facingT || pw === 'bolt')) inp.a = true;
        if (p.cdB <= 0 && adx < (pw === 'ice' ? 120 : 70) && Math.random() < 0.5) inp.b = true;
        if (pw === 'bolt' && p.cdB <= 0 && adx > 90 && adx < 120 && facingT) inp.b = true;
      }
    }
  }
  // не падать с острова
  if (p.x < G.x + 14 && inp.mx < 0) inp.mx = 1;
  if (p.x > G.x + G.w - 14 && inp.mx > 0) inp.mx = -1;
  if (p.y > G.y + 2 && p.vy > 0 && Math.random() < 0.5) inp.jump = true;
  return inp;
}
function resetBots() { mem.clear(); }

  stand: ['..osso.osso.', '..osso.osso.', '..osso.osso.', '..oddo.oddo.', '..oooo.oooo.'],
  walkA: ['.osso..osso.', '.osso..osso.', 'osso....osso', 'oddo....oddo', 'oooo....oooo'],
  walkB: ['...osssso...', '...osssso...', '...osssso...', '...oddddo...', '...oooooo...'],
  jump:  ['..osso.osso.', '..oddo.oddo.', '..oooo.oooo.', '............', '............'],
};
const PUNCH = ['.occcccccco.', '.osccccccsss', '.oscccccco..']; // рука вперёд (строки 8–10)

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(v * k))));
  return `rgb(${c})`;
}

const cache = new Map();
function getSprite(color, frame, punch) {
  const key = color + frame + (punch ? 'p' : '');
  if (cache.has(key)) return cache.get(key);
  const rows = [...BODY_TOP, ...LEGS[frame]];
  if (punch) rows.splice(8, 3, ...PUNCH);
  const pal = { o: '#6b3f1d', s: '#f2cc96', h: '#ffe4b8', d: '#d39a5c', e: '#4a2c12',
    c: color, p: shade(color, 0.55) };
  const cv = document.createElement('canvas'); cv.width = 12; cv.height = 18;
  const g = cv.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }));
  cache.set(key, cv);
  return cv;
}

// ===== render/renderer.js =====
// Рендер: мир в низком разрешении (пиксель-арт) → масштаб; метки, стрелки и HUD — в полном разрешении


const { W, H } = CFG;
const low = document.createElement('canvas'); low.width = W; low.height = H;
const lg = low.getContext('2d'); lg.imageSmoothingEnabled = false;
let bg = null;
const px = (g, c, x, y, w, h) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

function buildBackground() {
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  ['#2b3a67', '#33497b', '#3b5a8f', '#4a6ca4', '#5a7fb8', '#6c91c7', '#7fa3d6', '#93b5e0', '#a6c4e8']
    .forEach((c, i) => px(g, c, 0, i * 24, W, 24));
  px(g, '#c4daf0', 0, 205, W, 20);
  const cloud = (x, y, s) => { px(g, '#e8f1fb', x, y, 26 * s, 6 * s); px(g, '#e8f1fb', x + 5 * s, y - 4 * s, 14 * s, 4 * s); px(g, '#cfe0f2', x, y + 5 * s, 26 * s, s); };
  cloud(20, 30, 1.2); cloud(360, 22, 1.5); cloud(200, 40, 0.9); cloud(420, 90, 0.8); cloud(40, 110, 0.7);
  // дальние острова
  px(g, '#8aa9cf', 10, 200, 40, 5); px(g, '#8aa9cf', 420, 198, 50, 7);
  px(g, '#2a6f97', 0, 222, W, 48); px(g, '#22597a', 0, 245, W, 25);
  for (let i = 0; i < 30; i++) px(g, '#5fa8d3', (i * 37) % W, 226 + (i * 7) % 40, 6, 1);
  const G = CFG.platforms[0];
  // тело острова: сужается книзу, слои земли и камня
  for (let r = 0; r < 52; r++) {
    const inset = Math.floor(r * r / 14) + (r > 0 ? 2 : 0);
    const w = G.w - inset * 2; if (w <= 4) break;
    const c = r < 4 ? '#5d3a1a' : r % 7 < 3 ? '#8d5a2b' : r > 30 ? '#6e6e78' : '#7a4c24';
    px(g, c, G.x + inset, G.y + 5 + r, w, 1);
  }
  for (let i = 0; i < 40; i++) px(g, i % 3 ? '#6b3f1d' : '#9b9ba6', G.x + 20 + (i * 53) % (G.w - 40), G.y + 9 + (i * 7) % 26, 3, 2);
  px(g, '#4caf50', G.x, G.y, G.w, 3); px(g, '#2e7d32', G.x, G.y + 3, G.w, 2);
  for (let i = 0; i < 50; i++) px(g, '#7cd47f', G.x + (i * 23) % G.w, G.y - 1, 2, 1);
  // деревья и камни для красоты
  const tree = x => { px(g, '#6b3f1d', x, G.y - 14, 3, 14); px(g, '#2e7d32', x - 6, G.y - 26, 15, 13); px(g, '#4caf50', x - 4, G.y - 28, 11, 6); };
  tree(44); tree(432);
  px(g, '#9e9e9e', 190, G.y - 4, 8, 4); px(g, '#cfcfcf', 191, G.y - 4, 5, 1);
  for (const p of CFG.platforms.slice(1)) {
    px(g, '#7a4c24', p.x, p.y, p.w, p.h + 2); px(g, '#4caf50', p.x, p.y, p.w, 2);
    px(g, '#5d3a1a', p.x + 3, p.y + p.h + 2, p.w - 6, 2); px(g, '#5d3a1a', p.x + 8, p.y + p.h + 4, p.w - 16, 1);
  }
  return cv;
}

function frameOf(p) {
  if (!p.onGround) return 'jump';
  if (Math.abs(p.vx) > 10) return Math.floor(p.animT * 8) % 2 ? 'walkA' : 'walkB';
  return 'stand';
}

function ring(g, x, y, r, c, a, fill) {
  g.globalAlpha = a; g.strokeStyle = c; g.lineWidth = 1.5;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke();
  if (fill) { g.globalAlpha = a * 0.25; g.fillStyle = c; g.fill(); }
  g.globalAlpha = 1;
}

// пиксельная стрелка вниз
const ARROW = ['..###..', '..###..', '..###..', '#######', '.#####.', '..###..', '...#...'];
function drawArrow(ctx, cx, by, cell, color) {
  const w = 7 * cell, x0 = cx - w / 2, y0 = by - 7 * cell;
  ctx.fillStyle = '#000';
  ARROW.forEach((r, y) => [...r].forEach((c, x) => { if (c === '#') ctx.fillRect(x0 + x * cell - cell * 0.5, y0 + y * cell - cell * 0.5, cell * 2, cell * 2); }));
  ctx.fillStyle = color;
  ARROW.forEach((r, y) => [...r].forEach((c, x) => { if (c === '#') ctx.fillRect(x0 + x * cell, y0 + y * cell, cell + 0.5, cell + 0.5); }));
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fillRect(x0 + 2 * cell, y0, cell, cell * 3);
}

function render(ctx, view, w, alpha, myId) {
  if (!bg) bg = buildBackground();
  const t = w.time, m = w.match, P = CFG.powers;
  lg.drawImage(bg, 0, 0);
  for (let i = 0; i < 8; i++) px(lg, '#8cc8ea', ((i * 61 + t * 12) % (W + 10)) - 5, 230 + i * 4, 5, 1);
  // стены льда
  for (const wl of w.walls) { lg.globalAlpha = 0.85; px(lg, '#8ee8ff', wl.x, wl.y, wl.w, wl.h); px(lg, '#e0fbff', wl.x + 1, wl.y, 2, wl.h); lg.globalAlpha = 1; }
  const pos = [];
  for (const p of w.players) {
    if (p.dead > 0) continue;
    const x = p.px + (p.x - p.px) * alpha, y = p.py + (p.y - p.py) * alpha;
    pos.push([p, x, y]);
    const sc = p.scale || 1, chosen = m.chosenId === p.id;
    lg.globalAlpha = 0.3; px(lg, '#000', x - 5 * sc, y, 10 * sc, 1); lg.globalAlpha = 1;
    if (chosen && P[p.power]) { // аура силы
      const c = P[p.power].color, pulse = 0.25 + 0.15 * Math.sin(t * 8);
      lg.globalAlpha = pulse; lg.fillStyle = c;
      lg.beginPath(); lg.ellipse(x, y - 9 * sc, 9 * sc, 12 * sc, 0, 0, Math.PI * 2); lg.fill(); lg.globalAlpha = 1;
    }
    if (p.inv > 0 && Math.floor(t * 12) % 2) continue;
    const spr = getSprite(p.color, frameOf(p), p.attackT > 0.1);
    lg.save(); lg.translate(Math.round(x), Math.round(y - 18 * sc));
    if (p.facing < 0) lg.scale(-1, 1);
    lg.drawImage(spr, Math.round(-6 * sc), 0, Math.round(12 * sc), Math.round(18 * sc));
    lg.restore();
    if (p.slowT > 0) { lg.globalAlpha = 0.4; px(lg, '#8ee8ff', x - 6 * sc, y - 18 * sc, 12 * sc, 18 * sc); lg.globalAlpha = 1; }
    if (chosen) { // корона
      const cx = Math.round(x), cy = Math.round(y - 18 * sc - 4);
      lg.save(); lg.translate(cx, cy); lg.scale(sc / 1.5, sc / 1.5); lg.translate(-cx, -cy);
      px(lg, '#ffd23f', cx - 4, cy + 1, 9, 3); px(lg, '#ffd23f', cx - 4, cy - 1, 1, 2); px(lg, '#ffd23f', cx, cy - 2, 1, 3); px(lg, '#ffd23f', cx + 4, cy - 1, 1, 2);
      px(lg, '#ff4d4d', cx, cy + 2, 1, 1); lg.restore();
    }
    if (p.slam) ring(lg, x, p.y - 6, P.giant.bR, P.giant.color, 0.5 + 0.3 * Math.sin(t * 30), true);
  }
  // телеграфы
  for (const te of w.teles) {
    const o = w.players.find(q => q.id === te.owner); if (!o) continue;
    const k = 1 - te.t / te.ttl, a = 0.35 + 0.5 * k;
    if (te.k === 'ring') ring(lg, o.x, o.y - 10, te.r, te.c, a, true);
    else {
      const g = P.giant, rx = o.facing > 0 ? o.x + 4 : o.x - 4 - g.aW;
      lg.globalAlpha = a * 0.4; px(lg, te.c, rx, o.y - g.aH, g.aW, g.aH);
      lg.globalAlpha = a; lg.strokeStyle = te.c; lg.strokeRect(rx + 0.5, o.y - g.aH + 0.5, g.aW - 1, g.aH - 1); lg.globalAlpha = 1;
    }
  }
  // снаряды
  for (const pr of w.projs) {
    const x = pr.x - pr.vx * (1 - alpha) / CFG.TICK, y = pr.y - pr.vy * (1 - alpha) / CFG.TICK;
    if (pr.kind === 'fire') { px(lg, '#ff7a1a', x - 3, y - 3, 7, 7); px(lg, '#ffe83a', x - 1, y - 1, 3, 3); px(lg, '#ff4d00', x - 3 - Math.sign(pr.vx) * 4, y - 1, 3, 3); }
    else if (pr.kind === 'ice') { px(lg, '#8ee8ff', x - 3, y - 1, 6, 3); px(lg, '#fff', x - 1, y, 2, 1); }
    else { px(lg, '#fff', x - 1, y - 1, 3, 3); px(lg, pr.c, x - 1 - Math.sign(pr.vx) * 3, y, 3, 1); }
  }
  // эффекты
  for (const f of w.fx) {
    const k = f.t / f.ttl;
    if (f.k === 'ring') ring(lg, f.x, f.y, f.r * (1.1 - k * 0.4), f.c, k, false);
    else if (f.k === 'hit') { lg.globalAlpha = k; for (let i = 0; i < 4; i++) { const a = i * 1.57 + 0.6; px(lg, f.c, f.x + Math.cos(a) * (1 - k) * 8, f.y + Math.sin(a) * (1 - k) * 8, 2, 2); } lg.globalAlpha = 1; }
    else if (f.k === 'rect') { lg.globalAlpha = k * 0.7; px(lg, f.c, f.x, f.y, f.w, f.h); lg.globalAlpha = 1; }
    else if (f.k === 'bolt') {
      lg.globalAlpha = k; lg.strokeStyle = f.c; lg.lineWidth = 1.5; lg.beginPath(); lg.moveTo(f.x1, f.y1);
      for (let i = 1; i < 6; i++) lg.lineTo(f.x1 + (f.x2 - f.x1) * i / 6 + Math.sin(i * 7 + t * 50) * 3, f.y1 + (f.y2 - f.y1) * i / 6 + Math.cos(i * 5 + t * 40) * 3);
      lg.lineTo(f.x2, f.y2); lg.stroke(); lg.globalAlpha = 1;
    }
  }

  // ---- вывод на экран ----
  const { s, ox, oy, cw, ch, u } = view;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#22597a'; ctx.fillRect(0, 0, cw, ch);
  ctx.drawImage(low, ox, oy, W * s, H * s);
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.lineJoin = 'round';
  const fs = Math.round(11 * u);
  ctx.font = `bold ${fs}px system-ui, sans-serif`;
  const placed = [];
  for (const [p, x, y] of pos.sort((a, b) => a[1] - b[1])) {
    const me = p.id === myId, sc = p.scale || 1, chosen = m.chosenId === p.id;
    const bob = me ? Math.sin(t * 6) * 2 * u : 0;
    const sx = ox + x * s;
    const cell = Math.max(2, Math.round((me ? 2.2 : 1.6) * u));
    const txt = `${me ? '▶ ' : ''}${p.name} · ${p.label}`;
    const tw = ctx.measureText(txt).width + 6 * u, lh = fs + 9 * u;
    const sy = oy + (y - 18 * sc - (chosen ? 7 : 2)) * s - 2 * u;
    let by = sy - 7 * cell - 6 * u;
    // раздвигаем подписи (стрелка остаётся у персонажа)
    for (let k = 0; k < 6; k++) {
      const hit = placed.find(r => Math.abs(r.x - sx) < (r.w + tw) / 2 && Math.abs(r.y - by) < lh);
      if (!hit) break; by = hit.y - lh;
    }
    placed.push({ x: sx, y: by, w: tw });
    drawArrow(ctx, sx, sy + bob, cell, p.color);
    const bw = 30 * u;
    ctx.fillStyle = '#000a'; ctx.fillRect(sx - bw / 2 - u, by - u, bw + 2 * u, 5 * u);
    ctx.fillStyle = chosen ? P[p.power]?.color || '#fff' : p.color; ctx.fillRect(sx - bw / 2, by, bw * Math.max(0, p.hp / p.maxHp), 3 * u);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3 * u; ctx.fillStyle = p.color;
    ctx.strokeText(txt, sx, by - 2 * u); ctx.fillText(txt, sx, by - 2 * u);
  }
  drawHud(ctx, view, w, myId);
}

function fmt(sec) { sec = Math.max(0, Math.ceil(sec)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; }

function drawHud(ctx, view, w, myId) {
  const { cw, ch, u } = view, m = w.match, P = CFG.powers;
  if (m.phase === 'lobby') return;
  const label = (txt, x, y, size, color = '#fff', align = 'center') => {
    ctx.font = `bold ${Math.round(size * u)}px system-ui, sans-serif`; ctx.textAlign = align;
    ctx.lineWidth = 4 * u; ctx.strokeStyle = '#000'; ctx.strokeText(txt, x, y); ctx.fillStyle = color; ctx.fillText(txt, x, y);
  };
  ctx.textBaseline = 'top';
  const timer = m.phase === 'play' ? fmt(m.timer) : m.phase === 'countdown' ? fmt(CFG.roundTime) : '0:00';
  label(`Раунд ${m.round}/${CFG.rounds}   ${timer}`, cw / 2, 8 * u, 15);
  const c = w.players.find(p => p.id === m.chosenId);
  if (c && P[c.power]) {
    const bw = Math.min(cw * 0.42, 320 * u), x = cw / 2 - bw / 2, y = 30 * u;
    ctx.fillStyle = '#000b'; ctx.fillRect(x - 2 * u, y - 2 * u, bw + 4 * u, 14 * u);
    ctx.fillStyle = P[c.power].color; ctx.fillRect(x, y, bw * Math.max(0, c.hp / c.maxHp), 10 * u);
    label(`👑 ${c.name}${c.id === myId ? ' (ты)' : ''} — ${P[c.power].name}  ${Math.ceil(c.hp)}`, cw / 2, y + 14 * u, 12, P[c.power].color);
  }
  // таблица очков
  const list = [...w.players].sort((a, b) => b.score - a.score);
  list.forEach((p, i) => label(`${i + 1}. ${p.name}  ${Math.floor(p.score)}${p.id === m.chosenId ? ' 👑' : ''}`,
    10 * u + view.safeL, 8 * u + i * 15 * u, 12, p.color, 'left'));
  const me = w.players.find(p => p.id === myId);
  if (me && me.dead > 0 && m.phase === 'play') label(`Возрождение через ${Math.ceil(me.dead)}…`, cw / 2, ch * 0.42, 18);
  if (m.phase === 'countdown') label(String(Math.ceil(m.timer)), cw / 2, ch * 0.3, 48, '#ffd23f');
  if (m.msgT > 0 && m.msg) label(m.msg, cw / 2, ch * 0.2, 15, '#ffd23f');
}

// ===== input/touch.js =====
// Управление: плавающий джойстик слева, кнопки справа; клавиатура для ПК
function createInput() {
  const st = { mx: 0, my: 0, jumpHeld: false, jumpPressed: false, bP: false, aP: false };
  const base = document.getElementById('joy-base'), knob = document.getElementById('joy-knob');
  const zone = document.getElementById('joy-zone');
  let jid = null, cx = 0, cy = 0; const R = 45;
  zone.addEventListener('pointerdown', e => {
    jid = e.pointerId; cx = e.clientX; cy = e.clientY; zone.setPointerCapture(jid);
    base.style.display = 'block'; base.style.left = cx + 'px'; base.style.top = cy + 'px';
  });
  zone.addEventListener('pointermove', e => {
    if (e.pointerId !== jid) return;
    let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy);
    if (d > R) { dx *= R / d; dy *= R / d; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    st.mx = Math.abs(dx) > R * 0.2 ? dx / R : 0; st.my = Math.abs(dy) > R * 0.2 ? dy / R : 0;
  });
  const end = e => { if (e.pointerId !== jid) return; jid = null; st.mx = st.my = 0; base.style.display = 'none'; knob.style.transform = ''; };
  zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end);

  const bind = (id, down, up) => {
    const b = document.getElementById(id);
    b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('on'); down(); });
    const u = () => { b.classList.remove('on'); up && up(); };
    b.addEventListener('pointerup', u); b.addEventListener('pointercancel', u); b.addEventListener('pointerleave', u);
  };
  bind('btn-jump', () => { st.jumpHeld = true; st.jumpPressed = true; }, () => { st.jumpHeld = false; });
  bind('btn-a', () => { st.aP = true; });
  bind('btn-b', () => { st.bP = true; });

  const keys = new Set();
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.repeat) return; keys.add(e.code);
    if (['Space', 'KeyW', 'ArrowUp'].includes(e.code)) { st.jumpHeld = true; st.jumpPressed = true; }
    if (e.code === 'KeyJ') st.aP = true;
    if (e.code === 'KeyK' || e.code === 'ShiftLeft') st.bP = true;
  });
  addEventListener('keyup', e => {
    keys.delete(e.code);
    if (['Space', 'KeyW', 'ArrowUp'].includes(e.code)) st.jumpHeld = false;
  });

  // снимок ввода на один тик (нажатия сбрасываются после чтения)
  return function sample() {
    let mx = st.mx, my = st.my;
    if (keys.size) {
      mx = (keys.has('KeyD') || keys.has('ArrowRight')) - (keys.has('KeyA') || keys.has('ArrowLeft')) || mx;
      my = (keys.has('KeyS') || keys.has('ArrowDown')) ? 1 : my;
    }
    const out = { mx, my, jumpHeld: st.jumpHeld, jump: st.jumpPressed, b: st.bP, a: st.aP };
    st.jumpPressed = st.bP = st.aP = false;
    return out;
  };
}

// ===== net/net.js =====
// Сеть: PeerJS, звезда, авторитетный хост (план §1). Код комнаты 5 символов, peerId = izb-<КОД>

const ALPH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const makeCode = () => Array.from({ length: 5 }, () => ALPH[Math.floor(Math.random() * ALPH.length)]).join('');
const peerOpts = () => ({ config: { iceServers: CFG.iceServers }, debug: 1 });

function hostRoom(code, h) {
  const peer = new Peer('izb-' + code, peerOpts());
  const conns = new Map();
  peer.on('open', () => h.onOpen());
  peer.on('error', e => h.onError(e.type === 'unavailable-id' ? 'Код занят, попробуй ещё раз' : 'Ошибка сети: ' + e.type));
  peer.on('connection', conn => {
    conn.on('data', msg => {
      if (msg.t === 'hello') {
        if (msg.pass !== PASSWORD) { conn.send({ t: 'deny', why: 'Неверный пароль' }); setTimeout(() => conn.close(), 300); return; }
        const r = h.onJoin(conn.peer, msg);
        if (r !== true) { conn.send({ t: 'deny', why: r }); setTimeout(() => conn.close(), 300); return; }
        conns.set(conn.peer, conn); conn.send({ t: 'welcome', id: conn.peer }); h.onJoined && h.onJoined(conn.peer);
      } else if (conns.has(conn.peer)) h.onMsg(conn.peer, msg);
    });
    conn.on('close', () => { if (conns.delete(conn.peer)) h.onLeave(conn.peer); });
  });
  return {
    broadcast(msg) { for (const c of conns.values()) if (c.open) c.send(msg); },
    send(id, msg) { const c = conns.get(id); if (c && c.open) c.send(msg); },
    close() { peer.destroy(); },
  };
}

function joinRoom(code, hello, h) {
  const peer = new Peer(peerOpts());
  let conn = null, ok = false, done = false;
  const fail = setTimeout(() => { if (!ok) { done = true; h.onError('Не удалось подключиться. Проверь код или попробуй Wi‑Fi'); peer.destroy(); } }, 10000);
  peer.on('open', () => {
    conn = peer.connect('izb-' + code, { reliable: true });
    conn.on('open', () => conn.send({ t: 'hello', ...hello }));
    conn.on('data', msg => {
      if (msg.t === 'deny') { clearTimeout(fail); done = true; h.onError(msg.why); peer.destroy(); return; }
      if (msg.t === 'welcome') { ok = true; clearTimeout(fail); }
      h.onMsg(msg);
    });
    conn.on('close', () => { if (ok && !done) h.onClose(); });
  });
  peer.on('error', e => {
    if (done) return; clearTimeout(fail); done = true;
    h.onError(e.type === 'peer-unavailable' ? 'Комната не найдена' : 'Ошибка сети: ' + e.type);
  });
  return { send(msg) { if (conn && conn.open) conn.send(msg); }, close() { done = true; peer.destroy(); } };
}

// компактный снапшот мира
const r1 = v => Math.round(v * 10) / 10;
function snapshot(w) {
  return { t: r1(w.time), m: w.match,
    p: w.players.map(p => ({ id: p.id, name: p.name, color: p.color, label: p.label, isBot: p.isBot,
      x: r1(p.x), y: r1(p.y), vx: Math.round(p.vx), vy: Math.round(p.vy), facing: p.facing, onGround: p.onGround,
      hp: Math.round(p.hp), maxHp: p.maxHp, dead: r1(p.dead), inv: r1(p.inv), attackT: r1(p.attackT), power: p.power,
      scale: p.scale, score: Math.floor(p.score), slam: p.slam, animT: r1(p.animT), cdA: r1(p.cdA), cdB: r1(p.cdB),
      slowT: r1(p.slowT), stats: p.stats })),
    pr: w.projs.map(q => ({ x: r1(q.x), y: r1(q.y), vx: q.vx, vy: q.vy, kind: q.kind, c: q.c })),
    te: w.teles, wa: w.walls, fx: w.fx };
}

function fromSnapshots(prev, cur) {
  const pm = new Map((prev ? prev.p : []).map(p => [p.id, p]));
  return { time: cur.t, match: cur.m, projs: cur.pr, teles: cur.te, walls: cur.wa, fx: cur.fx,
    players: cur.p.map(p => { const o = pm.get(p.id); return { ...p, px: o && o.dead <= 0 ? o.x : p.x, py: o && o.dead <= 0 ? o.y : p.y }; }) };
}

// ===== main.js =====
// Оркестрация: экраны, режимы (боты / хост / клиент), тикер симуляции, рендер






const $ = id => document.getElementById(id);
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

function deviceLabel() {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return 'iPhone';
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'iPad';
  if (/Android/.test(ua)) return 'Android';
  return 'ПК';
}
const LABEL = deviceLabel();

// ---------- холст ----------
const canvas = $('game'), ctx = canvas.getContext('2d');
const view = { s: 1, ox: 0, oy: 0, cw: 0, ch: 0, u: 1, safeL: 0 };
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  view.cw = canvas.width = Math.round(innerWidth * dpr);
  view.ch = canvas.height = Math.round(innerHeight * dpr);
  view.s = Math.min(view.cw / CFG.W, view.ch / CFG.H);
  view.ox = Math.round((view.cw - CFG.W * view.s) / 2);
  view.oy = Math.round((view.ch - CFG.H * view.s) / 2);
  view.u = dpr * Math.min(1.25, Math.max(0.8, innerHeight / 400));
  view.safeL = Math.max(view.ox, 0);
}
addEventListener('resize', resize); resize();

// ---------- состояние ----------
let nick = store.get('izb-nick') || '';
let mode = null, world = null, myId = 'me', net = null, code = '';
let ticker = null, lastTick = 0, tickN = 0, sendTimer = null, wakeLock = null;
let snapPrev = null, snapCur = null, snapAt = 0, viewWorld = null, resultsShown = false;
const remote = new Map();
const sample = createInput();
const idle = createWorld(); // фон для меню

const screens = ['scr-login', 'scr-menu', 'scr-lobby', 'scr-results'];
function show(id) {
  for (const s of screens) $(s).classList.toggle('hidden', s !== id);
  $('controls').classList.toggle('hidden', !(mode && (id === null || id === 'scr-lobby')));
  if (id && document.activeElement && document.activeElement.blur && id !== 'scr-login' && id !== 'scr-menu') document.activeElement.blur();
}

// ---------- вход ----------
$('in-nick').value = nick;
$('go-login').onclick = () => {
  const n = $('in-nick').value.trim().slice(0, 12), pw = $('in-pass').value.trim();
  if (!n) return void ($('login-err').textContent = 'Придумай ник');
  if (pw !== PASSWORD) return void ($('login-err').textContent = 'Неверный пароль');
  nick = n; store.set('izb-nick', n); $('in-pass').value = ''; $('login-err').textContent = '';
  $('menu-nick').textContent = nick; show('scr-menu');
};
$('in-pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('go-login').click(); });

// ---------- общие ----------
const freeColor = () => CFG.colors.find(c => !world.players.some(p => p.color === c)) || CFG.colors[0];
function addBot() {
  if (world.players.length >= CFG.maxPlayers) return;
  let i = 1; while (world.players.some(p => p.id === 'bot' + i)) i++;
  addPlayer(world, { id: 'bot' + i, name: 'Бот ' + i, color: freeColor(), label: 'БОТ', isBot: true });
}
function startTicker() {
  stopTicker(); lastTick = performance.now();
  ticker = setInterval(tick, 1000 / CFG.TICK);
  try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => wakeLock = l).catch(() => {}); } catch {}
}
function stopTicker() { clearInterval(ticker); ticker = null; clearInterval(sendTimer); sendTimer = null; }

function tick() {
  const inputs = {};
  for (const p of world.players) {
    if (p.id === myId) inputs[p.id] = sample();
    else if (p.isBot) inputs[p.id] = botInput(world, p);
    else { const r = remote.get(p.id); if (r) { inputs[p.id] = { ...r }; r.jump = r.a = r.b = false; } }
  }
  step(world, inputs, 1 / CFG.TICK);
  lastTick = performance.now();
  if (mode === 'host' && ++tickN % CFG.SNAP_EVERY === 0) net.broadcast({ t: 's', s: snapshot(world) });
}

function leave(msg) {
  stopTicker();
  if (net) { try { net.close(); } catch {} net = null; }
  if (wakeLock) { try { wakeLock.release(); } catch {} wakeLock = null; }
  mode = null; world = null; viewWorld = snapPrev = snapCur = null; remote.clear(); resultsShown = false;
  document.body.classList.remove('is-host');
  $('menu-err').textContent = msg || '';
  show('scr-menu');
}
$('btn-exit').onclick = () => { if (confirm('Выйти в меню?')) leave(); };
$('lobby-leave').onclick = () => leave();
$('res-menu').onclick = () => leave();

// ---------- режим с ботами ----------
$('go-bots').onclick = () => {
  mode = 'bots'; myId = 'me'; resetBots(); document.body.classList.add('is-host');
  world = createWorld();
  addPlayer(world, { id: 'me', name: nick, color: CFG.colors[0], label: LABEL });
  for (let i = 0; i < +$('bots-n').value; i++) addBot();
  startMatch(world); resultsShown = false; startTicker(); show(null);
};

// ---------- хост ----------
function lobbyMsg() {
  return { t: 'lobby', code, players: world.players.map(p => ({ id: p.id, name: p.name, color: p.color, label: p.label, isBot: p.isBot })) };
}
function renderLobby(l) {
  $('lobby-code').textContent = l.code;
  $('lobby-list').innerHTML = '';
  for (const p of l.players) {
    const li = document.createElement('li');
    const left = document.createElement('span');
    const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = p.color;
    left.append(dot, document.createTextNode(p.name + (p.id === myId ? ' (ты)' : '')));
    const right = document.createElement('span'); right.textContent = p.label; right.style.color = '#c9cbe0';
    li.append(left, right); $('lobby-list').append(li);
  }
  $('lobby-hint').textContent = `Игроков: ${l.players.length}/${CFG.maxPlayers}. Скажи друзьям код и пароль`;
}
function lobbyChanged() { const l = lobbyMsg(); renderLobby(l); net && net.broadcast(l); }

$('go-host').onclick = () => {
  mode = 'host'; myId = 'host'; resetBots(); document.body.classList.add('is-host');
  code = makeCode();
  world = createWorld();
  addPlayer(world, { id: 'host', name: nick, color: CFG.colors[0], label: LABEL });
  $('menu-err').textContent = 'Создаём комнату…';
  net = hostRoom(code, {
    onOpen() { $('menu-err').textContent = ''; startTicker(); lobbyChanged(); show('scr-lobby'); },
    onError(e) { leave(e); },
    onJoin(id, msg) {
      if (world.match.phase !== 'lobby') return 'Матч уже идёт';
      if (world.players.length >= CFG.maxPlayers) return 'Комната заполнена';
      addPlayer(world, { id, name: String(msg.name || 'Игрок').slice(0, 12), color: freeColor(), label: String(msg.label || '?').slice(0, 10) });
      return true;
    },
    onJoined() { lobbyChanged(); },
    onMsg(id, msg) {
      if (msg.t !== 'in') return;
      const r = remote.get(id) || {};
      remote.set(id, { mx: +msg.mx || 0, my: +msg.my || 0, jumpHeld: !!msg.jumpHeld,
        jump: r.jump || !!msg.jump, a: r.a || !!msg.a, b: r.b || !!msg.b });
    },
    onLeave(id) { removePlayer(world, id); remote.delete(id); if (world.match.phase === 'lobby') lobbyChanged(); },
  });
};
$('bot-add').onclick = () => { addBot(); lobbyChanged(); };
$('bot-del').onclick = () => { const b = [...world.players].reverse().find(p => p.isBot); if (b) { removePlayer(world, b.id); lobbyChanged(); } };
$('go-start').onclick = () => {
  if (world.players.length < 2) return void ($('lobby-hint').textContent = 'Нужно минимум 2 игрока (добавь бота)');
  startMatch(world); resultsShown = false; net.broadcast({ t: 'start' }); show(null);
};
$('go-rematch').onclick = () => {
  startMatch(world); resultsShown = false; if (net) net.broadcast({ t: 'start' }); show(null);
};

// ---------- клиент ----------
$('go-join').onclick = () => {
  const c = $('in-code').value.trim().toUpperCase();
  if (c.length !== 5) return void ($('menu-err').textContent = 'Код — 5 символов');
  mode = 'client'; code = c; document.body.classList.remove('is-host');
  $('menu-err').textContent = 'Подключаемся…';
  net = joinRoom(c, { name: nick, label: LABEL, pass: PASSWORD }, {
    onMsg(msg) {
      if (msg.t === 'welcome') {
        myId = msg.id; $('menu-err').textContent = '';
        sendTimer = setInterval(() => net && net.send({ t: 'in', ...sample() }), 1000 / CFG.TICK);
      } else if (msg.t === 'lobby') { renderLobby(msg); if (!snapCur || snapCur.m.phase === 'lobby') show('scr-lobby'); }
      else if (msg.t === 'start') { resultsShown = false; show(null); }
      else if (msg.t === 's') { snapPrev = snapCur; snapCur = msg.s; snapAt = performance.now(); viewWorld = fromSnapshots(snapPrev, snapCur); }
    },
    onClose() { leave('Хост вышел из игры'); },
    onError(e) { leave(e); },
  });
};
$('in-code').addEventListener('keydown', e => { if (e.key === 'Enter') $('go-join').click(); });

// ---------- итоги ----------
function showResults(w) {
  resultsShown = true;
  const list = [...w.players].sort((a, b) => b.score - a.score);
  $('res-list').innerHTML = '';
  list.forEach((p, i) => {
    const li = document.createElement('li');
    const l = document.createElement('span'); l.textContent = `${['🥇', '🥈', '🥉'][i] || i + 1 + '.'} ${p.name}`; l.style.color = p.color;
    const r = document.createElement('span'); r.textContent = Math.floor(p.score);
    li.append(l, r); $('res-list').append(li);
  });
  const by = f => list.reduce((a, b) => (f(b) > f(a) ? b : a));
  const dm = by(p => p.stats.dmg), ct = by(p => p.stats.chosenTime);
  $('res-awards').textContent = `💥 Больше всего урона: ${dm.name} (${Math.round(dm.stats.dmg)}) · 👑 Дольше всех Избранный: ${ct.name} (${Math.round(ct.stats.chosenTime)} с)`;
  show('scr-results');
}

// ---------- рендер ----------
function frame(now) {
  let w = null, alpha = 1;
  if (mode === 'client') { w = viewWorld; alpha = Math.min(1, (now - snapAt) / (CFG.SNAP_EVERY * 1000 / CFG.TICK)); }
  else if (world) { w = world; alpha = Math.min(1, (now - lastTick) / (1000 / CFG.TICK)); }
  if (!w) { idle.time = now / 1000; w = idle; }
  render(ctx, view, w, alpha, myId);
  if (mode && w !== idle) {
    const me = w.players.find(p => p.id === myId);
    if (me) {
      const ch = w.match.chosenId === myId;
      const bb = $('btn-b'); const lbl = ch ? '★' : '⇢'; if (bb.textContent !== lbl) bb.textContent = lbl;
      bb.classList.toggle('cd', me.cdB > 0); $('btn-a').classList.toggle('cd', me.cdA > 0.05);
    }
    if (w.match.phase === 'end' && !resultsShown) showResults(w);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
show(nick ? 'scr-login' : 'scr-login');
window.__game = { get world() { return world || viewWorld; }, get mode() { return mode; } }; // для QA

</script>
